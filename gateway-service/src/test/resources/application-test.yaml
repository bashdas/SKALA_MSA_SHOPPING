server:
  port: 0

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-customers
              uri: ${USER_SERVICE_URL:http://127.0.0.1:1}
              predicates:
                - Path=/api/customers/**
            - id: order-service-products
              uri: ${ORDER_SERVICE_URL:http://127.0.0.1:1}
              predicates:
                - Path=/api/products/**
            - id: order-service-orders
              uri: ${ORDER_SERVICE_URL:http://127.0.0.1:1}
              predicates:
                - Path=/api/orders/**
