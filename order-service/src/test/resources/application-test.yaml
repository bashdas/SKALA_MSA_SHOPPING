spring:
  datasource:
    url: jdbc:h2:mem:orderdb-test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

clients:
  user-service:
    base-url: http://localhost:18081
    connect-timeout: 100ms
    read-timeout: 200ms

jwt:
  secret: order-service-jwt-test-secret-key-with-at-least-thirty-two-bytes
